<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bharat Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Bharat Weather</h1>
      <p class="tagline">Live weather for cities across India</p>
    </header>

    <label for="city-select">Choose a city</label>
    <select id="city-select"></select>

    <div id="loader" class="loader" hidden>
      <div class="spinner"></div>
      <p>Fetching weather...</p>
    </div>

    <section id="weather" aria-live="polite"></section>

    <footer>Data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
